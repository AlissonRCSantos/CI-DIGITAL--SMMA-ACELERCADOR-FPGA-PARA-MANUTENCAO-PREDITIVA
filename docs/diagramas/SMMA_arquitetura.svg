<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1010" viewBox="0 0 1720 1010" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E57C2"/></marker>
<style>
.nm { font-family: DejaVu Sans Mono, Consolas, monospace; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
.sb { font-size: 11px; fill: #37474F; text-anchor: middle; }
.lb { font-size: 11px; fill: #263238; }
.fk { font-size: 10.5px; fill: #212121; font-style: italic; }
.ct { font-size: 11.5px; fill: #5E35B1; }
.lg { font-size: 12px; fill: #263238; }
.d { fill: none; stroke: #263238; stroke-width: 1.5; }
.c { fill: none; stroke: #7E57C2; stroke-width: 1.3; stroke-dasharray: 6 4; }
</style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="28" y="40" font-size="22" font-weight="bold" fill="#263238">SMMA -- Smart Machine Monitoring Accelerator (DE0-CV, Cyclone V, 50 MHz)</text>
<text x="28" y="64" font-size="13" fill="#546E7A">Arquitetura integrada: cada caixa e uma instancia real do SMMA_Top. Uma janela = 8503 amostras brutas = 1056 decimadas = 32 quadros de FFT.</text>
<g id="src"><rect x="28" y="96" width="184" height="66" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
<text x="120.0" y="120" class="nm" fill="#1565C0">Sample_Source</text>
<text x="120.0" y="138" class="sb">ROM: 12 janelas reais</text>
<text x="120.0" y="152" class="sb">25,6 kHz, Q1.15</text>
</g>
<g id="fir"><rect x="28" y="296" width="184" height="66" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
<text x="120.0" y="320" class="nm" fill="#1565C0">FIR_Decimator</text>
<text x="120.0" y="338" class="sb">63 taps @1,4 kHz</text>
<text x="120.0" y="352" class="sb">decimacao /8 -> 3,2 kHz</text>
</g>
<g id="fb"><rect x="262" y="96" width="184" height="66" rx="8" fill="#ECEFF1" stroke="#455A64" stroke-width="1.6"/>
<text x="354.0" y="120" class="nm" fill="#455A64">Frame_Builder</text>
<text x="354.0" y="138" class="sb">quadros de 64 amostras</text>
<text x="354.0" y="152" class="sb">salto 32 (32 quadros)</text>
</g>
<g id="fft"><rect x="486" y="96" width="184" height="66" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
<text x="578.0" y="120" class="nm" fill="#2E7D32">FFT_Top</text>
<text x="578.0" y="138" class="sb">radix-2 DIT, 64 pontos</text>
<text x="578.0" y="152" class="sb">Q1.15, 4 DSP, magnitude</text>
</g>
<g id="sa"><rect x="710" y="96" width="184" height="66" rx="8" fill="#ECEFF1" stroke="#455A64" stroke-width="1.6"/>
<text x="802.0" y="120" class="nm" fill="#455A64">Spectrum_Accumulator</text>
<text x="802.0" y="138" class="sb">espectro medio</text>
<text x="802.0" y="152" class="sb">32 quadros x 32 bins</text>
</g>
<g id="fs"><rect x="934" y="96" width="184" height="66" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.6"/>
<text x="1026.0" y="120" class="nm" fill="#00838F">Feature_Spectral</text>
<text x="1026.0" y="138" class="sb">8 features: r_1x..r_3x,</text>
<text x="1026.0" y="152" class="sb">bandas, log2E, centroide</text>
</g>
<g id="pk"><rect x="934" y="196" width="184" height="66" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.6"/>
<text x="1026.0" y="220" class="nm" fill="#F57F17">peak_detector</text>
<text x="1026.0" y="238" class="sb">3 maiores picos</text>
<text x="1026.0" y="252" class="sb">acima do limiar</text>
</g>
<g id="mdc"><rect x="1158" y="196" width="184" height="66" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.6"/>
<text x="1250.0" y="220" class="nm" fill="#F57F17">mdc_gcd</text>
<text x="1250.0" y="238" class="sb">k0 = MDC(picos)</text>
<text x="1250.0" y="252" class="sb">Euclides (subtracoes)</text>
</g>
<g id="f0"><rect x="1158" y="296" width="184" height="66" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.6"/>
<text x="1250.0" y="320" class="nm" fill="#F57F17">f0_estimator</text>
<text x="1250.0" y="338" class="sb">f0 = k0 . fs / N</text>
<text x="1250.0" y="352" class="sb">(50 Hz/bin)</text>
</g>
<g id="lg"><rect x="710" y="428" width="184" height="66" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
<text x="802.0" y="452" class="nm" fill="#2E7D32">FFT_Log2_Compress</text>
<text x="802.0" y="470" class="sb">log2 de Mitchell</text>
<text x="802.0" y="484" class="sb">zero DSP</text>
</g>
<g id="sb"><rect x="934" y="428" width="184" height="66" rx="8" fill="#ECEFF1" stroke="#455A64" stroke-width="1.6"/>
<text x="1026.0" y="452" class="nm" fill="#455A64">Spectrogram_Buffer</text>
<text x="1026.0" y="470" class="sb">imagem 32x32</text>
<text x="1026.0" y="484" class="sb">transposta</text>
</g>
<g id="cnn"><rect x="1158" y="428" width="184" height="66" rx="8" fill="#FBE9E7" stroke="#BF360C" stroke-width="1.6"/>
<text x="1250.0" y="452" class="nm" fill="#BF360C">CNN_Top</text>
<text x="1250.0" y="470" class="sb">conv 3x3 x8 + ReLU</text>
<text x="1250.0" y="484" class="sb">pool + GAP + densa</text>
</g>
<g id="lr"><rect x="486" y="560" width="184" height="66" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.6"/>
<text x="578.0" y="584" class="nm" fill="#6A1B9A">LMS_Residual_Feature</text>
<text x="578.0" y="602" class="sb">janela + energias</text>
<text x="578.0" y="616" class="sb">r_lms = Se^2 / Sd^2</text>
</g>
<g id="lms"><rect x="710" y="560" width="184" height="66" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.6"/>
<text x="802.0" y="584" class="nm" fill="#6A1B9A">LMS_Filter_Top</text>
<text x="802.0" y="602" class="sb">8 coef., mu = 2^-3</text>
<text x="802.0" y="616" class="sb">preditor x[n-1] -> x[n]</text>
</g>
<g id="ac"><rect x="486" y="692" width="184" height="66" rx="8" fill="#FCE4EC" stroke="#AD1457" stroke-width="1.6"/>
<text x="578.0" y="716" class="nm" fill="#AD1457">autocorrelacao_yw</text>
<text x="578.0" y="734" class="sb">rho[0..3] = r[k]/r[0]</text>
<text x="578.0" y="748" class="sb">2 multiplicadores</text>
</g>
<g id="yw"><rect x="710" y="692" width="184" height="66" rx="8" fill="#FCE4EC" stroke="#AD1457" stroke-width="1.6"/>
<text x="802.0" y="716" class="nm" fill="#AD1457">Yule_Walker_Solver</text>
<text x="802.0" y="734" class="sb">monta R (Toeplitz 3x3)</text>
<text x="802.0" y="748" class="sb">a = R^-1 r</text>
</g>
<g id="gj"><rect x="934" y="692" width="184" height="66" rx="8" fill="#FCE4EC" stroke="#AD1457" stroke-width="1.6"/>
<text x="1026.0" y="716" class="nm" fill="#AD1457">gauss_jordan_inv</text>
<text x="1026.0" y="734" class="sb">Gauss-Jordan, pivo</text>
<text x="1026.0" y="748" class="sb">parcial, ate 4x4, Q8.16</text>
</g>
<g id="col"><rect x="1382" y="96" width="150" height="662" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.6"/>
<text x="1457.0" y="120" class="nm" fill="#00838F">Feature_Collector</text>
<text x="1457.0" y="138" class="sb"></text>
</g>
<g id="tree"><rect x="1560" y="330" width="140" height="80" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.6"/>
<text x="1630.0" y="354" class="nm" fill="#00838F">ML_Tree</text>
<text x="1630.0" y="372" class="sb">arvore de decisao</text>
<text x="1630.0" y="386" class="sb">141 nos, 0 DSP</text>
</g>
<g id="ctl"><rect x="262" y="830" width="1080" height="74" rx="8" fill="#EDE7F6" stroke="#311B92" stroke-width="1.6"/>
<text x="802.0" y="854" class="nm" fill="#311B92">SMMA_Global_Control</text>
<text x="802.0" y="872" class="sb">FSM: PARADO > ARRANCA > ADQUIRE > DECIDE > PRONTO</text>
<text x="802.0" y="886" class="sb">start unico (arranca) para todos os blocos; espera ready/done de todos; registra o veredito</text>
</g>
<g id="pan"><rect x="1382" y="830" width="150" height="60" rx="8" fill="#F1F8E9" stroke="#33691E" stroke-width="1.6"/>
<text x="1457.0" y="854" class="nm" fill="#33691E">SMMA_Panel</text>
<text x="1457.0" y="872" class="sb">HEX0..5, LEDR[9:0]</text>
</g>
<text x="1457" y="166" class="sb">vetor de 16</text>
<text x="1457" y="184" class="sb">caracteristicas</text>
<text x="1457" y="202" class="sb"></text>
<text x="1457" y="220" class="sb">0-7  FFT</text>
<text x="1457" y="238" class="sb">8    LMS</text>
<text x="1457" y="256" class="sb">9-11 rho</text>
<text x="1457" y="274" class="sb">12   f0 (MDC)</text>
<text x="1457" y="292" class="sb">13-15 a1..a3</text>
<text x="1457" y="310" class="sb"></text>
<text x="1457" y="328" class="sb">arvore usa</text>
<text x="1457" y="346" class="sb">0..11 (treino)</text>
